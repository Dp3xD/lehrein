<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lehrein — lofi and nature sounds for deep study</title>
<meta name="description" content="Lofi stations and nature sounds (river, ocean, rain, fire) for studying. Mix them, start a focus timer, and watch the waves roll in at golden hour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --text:#FFF3E3; --muted:rgba(255,243,227,.72); --line:rgba(255,226,196,.2);
  --panel:rgba(52,26,44,.5); --panel-strong:rgba(52,26,44,.82); --hover:rgba(255,236,214,.1);
  --sun:#FFC56E; --sun-rgb:255,197,110; --coral:#FF9C8A; --ink:#2A1626;
  --ui:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --script:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* The golden-hour scene is the page, so the palette is the same in both viewer themes. */
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --panel:rgba(52,26,44,.55); } }
:root[data-theme="dark"]{ --panel:rgba(52,26,44,.5); }
:root[data-theme="light"]{ --panel:rgba(52,26,44,.55); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#E0866C;color:var(--text);font-family:var(--sans);font-size:1rem;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:12px}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}

.ui{position:relative;height:100%;pointer-events:none}
.ui > *{pointer-events:auto;transition:opacity .9s ease}
body.idle .fade{opacity:0}
.glass{background:var(--panel);backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 34px rgba(42,22,38,.22)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background:var(--panel-strong)} }

.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.mark{font-family:var(--script);font-size:2.3rem;font-weight:700;line-height:1;text-shadow:0 2px 10px rgba(42,22,38,.4);display:flex;gap:.55rem;align-items:baseline}
.mark span{font-family:var(--sans);font-size:.95rem;color:var(--sun);letter-spacing:0;text-shadow:0 1px 4px rgba(42,22,38,.5)}
.top-r{display:flex;gap:.5rem;align-items:center}
.pill{font-family:var(--ui);font-weight:700;font-size:.95rem;padding:.5rem 1.1rem;border-radius:999px}
.pill:hover{background:var(--panel-strong)}
.chip{font-variant-numeric:tabular-nums}
.chip[hidden]{display:none}

.mix{position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);right:20px;width:330px;max-height:calc(100% - 200px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:1rem 1rem 1.1rem;scrollbar-width:thin}
.mix[hidden]{display:none}
.mix h2{font-family:var(--ui);font-weight:800;font-size:1.05rem;margin:.35rem 0 .5rem;color:var(--sun)}
.mix h2 + p{margin:-.35rem 0 .6rem;color:var(--muted);font-size:.88rem}
.mix section + section{margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.stn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.75rem;text-align:left;padding:.6rem .8rem;border-radius:16px}
.stn:hover{background:var(--hover)}
.stn .n{font-family:var(--ui);font-weight:700;font-size:1rem}
.stn .d{color:var(--muted);font-size:.84rem;display:block;line-height:1.3}
.stn[aria-pressed="true"]{background:rgba(var(--sun-rgb),.22)}
.stn .dot{width:12px;height:12px;flex:none;border-radius:50%;background:transparent;border:2px solid var(--muted)}
.stn[aria-pressed="true"] .dot{background:var(--sun);border-color:var(--sun)}

.nat{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.25rem .75rem;padding:.4rem .5rem;border-radius:16px}
.nat .tg{display:flex;align-items:center;gap:.55rem;padding:.35rem .6rem .35rem .45rem;border-radius:999px;min-width:104px}
.nat .tg:hover{background:var(--hover)}
.nat .tg svg{width:22px;height:22px;opacity:.55}
.nat .tg span{font-family:var(--ui);font-weight:700;font-size:1rem;color:var(--muted)}
.nat .tg[aria-pressed="true"] svg{opacity:1}
.nat .tg[aria-pressed="true"] span{color:var(--text)}
.nat input{width:100%}
.nat input:disabled{opacity:.35}
input[type=range]{accent-color:var(--sun)}

.timer{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.time{font-family:var(--ui);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.6ch}
.seg{display:flex;background:rgba(42,22,38,.3);border-radius:999px;padding:4px}
.seg button{padding:.3rem .7rem;border-radius:999px;font-weight:700;color:var(--muted);font-size:.88rem}
.seg button[aria-pressed="true"]{background:rgba(255,236,214,.18);color:var(--text)}
.tbtns{display:flex;gap:.4rem;margin-top:.7rem}
.btn{padding:.5rem 1.15rem;border-radius:999px;font-family:var(--ui);font-weight:700;font-size:.95rem}
.btn.primary{background:var(--sun);color:var(--ink);box-shadow:0 6px 18px rgba(42,22,38,.25)}
.btn.primary:active{transform:scale(.97)}
.btn.ghost{border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover)}
.custom{display:flex;align-items:center;gap:.6rem;margin-top:.75rem;color:var(--muted);font-size:.92rem;font-weight:600}
.custom[hidden]{display:none}
.custom input{width:6rem;padding:.42rem .9rem;border-radius:999px;border:1px solid var(--line);background:rgba(42,22,38,.3);color:var(--text);font:inherit;font-weight:700}
.me{width:40px;height:40px;padding:0;display:grid;place-items:center;color:var(--text);text-decoration:none}
.me:hover{background:var(--panel-strong)}
.me svg{width:20px;height:20px}
.tnote{margin:.55rem 0 0;color:var(--muted);font-size:.86rem;min-height:1.3em}

.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);max-width:calc(100% - 40px);text-align:center}
.player .bar{text-align:left}
.tag{font-family:var(--script);font-weight:600;font-size:1.6rem;line-height:1.1;margin:0 0 .45rem;color:var(--text);text-shadow:0 2px 6px rgba(42,22,38,.55)}
.bar{display:flex;align-items:center;gap:.85rem;padding:.55rem 1.1rem .55rem .55rem;border-radius:999px;flex-wrap:wrap}
#play{width:54px;height:54px;flex:none;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(var(--sun-rgb),.45)}
#play:active{transform:scale(.95)}
#play svg{width:22px;height:22px}
#eq{width:34px;height:22px;flex:none}
.np{min-width:0;max-width:240px}
.np .n{font-family:var(--ui);font-weight:800;font-size:1.05rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .d{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:.15rem}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon:hover{background:var(--hover)}
.icon svg{width:18px;height:18px}
.vol{display:flex;align-items:center;gap:.4rem;color:var(--muted)}
.vol input{width:96px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:899px){
  .mix{left:12px;right:12px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);max-height:min(62vh,calc(100% - 230px))}
  .player{left:12px;right:12px;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:none}
  .top{left:14px;right:14px}
}
@media (max-width:560px){
  .bar{gap:.55rem}
  .np{flex:1 1 120px}
  .vol{width:100%;padding-left:.2rem}
  .vol input{flex:1}
  .mix{bottom:calc(env(safe-area-inset-bottom,0px) + 175px)}
}
@media (prefers-reduced-motion: reduce){
  .ui > *{transition:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="ui" id="ui">
  <header class="top fade">
    <div class="mark">lehrein <span>lofi by the sea</span></div>
    <div class="top-r">
      <button class="pill glass chip" id="chip" hidden aria-label="Focus timer running, open sounds panel"></button>
      <button class="pill glass" id="mixbtn" aria-expanded="true" aria-controls="mix">Sounds</button>
      <!-- Portfolio link -->
      <a class="pill glass me" href="https://dp3xd.github.io" target="_blank" rel="noopener" aria-label="Made by Dp, visit my portfolio" title="Made by Dp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10h11.5v4.5a5 5 0 0 1-5 5h-1.5a5 5 0 0 1-5-5V10zM16 11.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c0 1-.9 1.5-.9 2.5S8 7.5 8 8.2M11.5 3.5c0 1-.9 1.5-.9 2.5s.9 1.5.9 2.2"/></svg>
      </a>
    </div>
  </header>

  <aside class="mix glass fade" id="mix" aria-label="Sounds and timer">
    <section>
      <h2>Lofi stations</h2>
      <ul class="list" id="stations"></ul>
    </section>
    <section>
      <h2>Nature sounds</h2>
      <p>Layer as many as you like.</p>
      <ul class="list" id="nature"></ul>
    </section>
    <section>
      <h2>Focus timer</h2>
      <div class="timer">
        <div class="time" id="time">25:00</div>
        <div class="seg" role="group" aria-label="Session length">
          <button data-min="25" aria-pressed="true">25m</button>
          <button data-min="50" aria-pressed="false">50m</button>
          <button data-min="90" aria-pressed="false">90m</button>
          <button data-custom="1" aria-pressed="false">Custom</button>
        </div>
      </div>
      <label class="custom" id="customRow" hidden>Minutes
        <input type="number" id="customMin" min="1" max="240" value="40" inputmode="numeric">
      </label>
      <div class="tbtns">
        <button class="btn primary" id="tstart">Start session</button>
        <button class="btn ghost" id="treset">Reset</button>
      </div>
      <p class="tnote" id="tnote" aria-live="polite"></p>
    </section>
  </aside>

  <div class="player fade">
    <p class="tag">Let the waves keep time while you work.</p>
    <div class="bar glass">
      <button id="play" aria-label="Play">
        <svg id="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>
        <svg id="ico-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4.2" height="14" rx="2.1"/><rect x="13.8" y="5" width="4.2" height="14" rx="2.1"/></svg>
      </button>
      <canvas id="eq" width="68" height="44" aria-hidden="true"></canvas>
      <div class="np" aria-live="polite">
        <div class="n" id="np-name">Golden Hour</div>
        <div class="d" id="np-desc">press play</div>
      </div>
      <div class="ctl">
        <button class="icon" id="prev" aria-label="Previous station"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1.3"/><path d="M19 6.3v11.4a1 1 0 0 1-1.55.83l-8.2-5.7a1 1 0 0 1 0-1.66l8.2-5.7A1 1 0 0 1 19 6.3z"/></svg></button>
        <button class="icon" id="next" aria-label="Next station"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="16.4" y="5" width="2.6" height="14" rx="1.3"/><path d="M5 6.3v11.4a1 1 0 0 0 1.55.83l8.2-5.7a1 1 0 0 0 0-1.66l-8.2-5.7A1 1 0 0 0 5 6.3z"/></svg></button>
      </div>
      <label class="vol"><span class="sr">Volume</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <input type="range" id="vol" min="0" max="100" value="70">
      </label>
    </div>
  </div>
</div>

<script>
/* ===================== painted golden-hour shore ===================== */
const Scene = (() => {
  const cv = document.getElementById('bg'), c = cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const R = (a, b) => a + Math.random() * (b - a);
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, f, al) => { const A = hex(a), B = hex(b); return `rgba(${Math.round(A[0] + (B[0] - A[0]) * f)},${Math.round(A[1] + (B[1] - A[1]) * f)},${Math.round(A[2] + (B[2] - A[2]) * f)},${al})`; };
  let W, H, S, hz, shore, seaH, sun, LA, LB, LC, glints, swells, gulls, raf, last = 0, narrow;

  function layer() { const l = document.createElement('canvas'); l.width = cv.width; l.height = cv.height; const x = l.getContext('2d'); x.setTransform(S, 0, 0, S, 0, 0); return [l, x]; }

  // ---------- sky ----------
  function sky(x) {
    const g = x.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#24456A'); g.addColorStop(.28, '#4F6D97'); g.addColorStop(.52, '#A9879D'); g.addColorStop(.76, '#EFA67B'); g.addColorStop(1, '#FFD893');
    x.fillStyle = g; x.fillRect(0, 0, W, hz + 2);
    const rg = x.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, Math.max(W, H) * .6);
    rg.addColorStop(0, 'rgba(255,238,186,.95)'); rg.addColorStop(.07, 'rgba(255,216,150,.6)'); rg.addColorStop(.32, 'rgba(255,170,120,.2)'); rg.addColorStop(1, 'rgba(255,160,120,0)');
    x.fillStyle = rg; x.fillRect(0, 0, W, hz + 2);

    const banks = [[.16, .13, .36], [.7, .09, .42], [.44, .26, .5], [.88, .3, .3], [.08, .34, .28], [.6, .38, .34]];
    banks.forEach(([bx, by, bw]) => {
      bx *= W; by *= H; bw *= Math.max(W, 700);
      const n = Math.round(26 + bw / 14), bh = H * .03;
      for (let i = 0; i < n; i++) {
        const u = R(-.5, .5), px = bx + u * bw, py = by + R(-1, 1) * bh * Math.cos(u * Math.PI), r = R(.035, .1) * bw;
        const lit = Math.max(0, Math.min(1, .5 + (py - by) / bh * .5));
        const warm = Math.max(0, 1 - Math.hypot(px - sun.x, (py - sun.y) * 1.6) / Math.max(W, H) * 1.5);
        const f = Math.min(1, lit * .7 + warm * .5);
        x.save(); x.translate(px, py); x.scale(1, .42);
        const cg = x.createRadialGradient(0, 0, 0, 0, 0, r);
        cg.addColorStop(0, mix('#6F6590', '#FFB88A', f, .34)); cg.addColorStop(.6, mix('#6F6590', '#FFB88A', f, .18)); cg.addColorStop(1, mix('#6F6590', '#FFB88A', f, 0));
        x.fillStyle = cg; x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fill(); x.restore();
        if (lit > .6) {
          x.save(); x.translate(px, py + r * .12); x.scale(1, .2);
          const hg = x.createRadialGradient(0, 0, 0, 0, 0, r * .8);
          hg.addColorStop(0, 'rgba(255,214,156,.22)'); hg.addColorStop(1, 'rgba(255,214,156,0)');
          x.fillStyle = hg; x.beginPath(); x.arc(0, 0, r * .8, 0, Math.PI * 2); x.fill(); x.restore();
        }
      }
    });
    for (let i = 0; i < 6; i++) {
      const y = hz - H * R(.012, .07), cx = R(-.1, 1.1) * W, rw = R(.15, .35) * W;
      x.save(); x.translate(cx, y); x.scale(1, .04);
      const sg = x.createRadialGradient(0, 0, 0, 0, 0, rw);
      sg.addColorStop(0, 'rgba(250,180,128,.5)'); sg.addColorStop(1, 'rgba(250,180,128,0)');
      x.fillStyle = sg; x.beginPath(); x.arc(0, 0, rw, 0, Math.PI * 2); x.fill(); x.restore();
    }
    x.save(); x.beginPath(); x.rect(0, 0, W, hz); x.clip();
    const sg = x.createRadialGradient(sun.x, sun.y, sun.r * .6, sun.x, sun.y, sun.r * 2.4);
    sg.addColorStop(0, 'rgba(255,240,200,.9)'); sg.addColorStop(1, 'rgba(255,220,160,0)');
    x.fillStyle = sg; x.beginPath(); x.arc(sun.x, sun.y, sun.r * 2.4, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#FFF3D2'; x.beginPath(); x.arc(sun.x, sun.y, sun.r, 0, Math.PI * 2); x.fill();
    x.restore();
  }

  // ---------- headland with a lighthouse ----------
  function hills(x) {
    const end = W * (narrow ? .5 : .38);
    const h1 = p => H * .07 * Math.pow(Math.sin(Math.PI * Math.min(1, p * 1.08)), .8) * (1 - p * .55) + Math.sin(p * 19) * H * .002;
    const h2 = p => H * .042 * Math.pow(Math.sin(Math.PI * Math.min(1, p * 1.15)), .9) * (1 - p * .4);
    x.fillStyle = 'rgba(150,108,138,.6)'; x.beginPath(); x.moveTo(-10, hz);
    for (let i = 0; i <= 50; i++) { const p = i / 50; x.lineTo(-10 + p * (end + 10), hz - h1(p)); } x.lineTo(end, hz + 1); x.closePath(); x.fill();
    const e2 = end * .62;
    x.fillStyle = 'rgba(98,74,104,.9)'; x.beginPath(); x.moveTo(-10, hz + 1);
    for (let i = 0; i <= 40; i++) { const p = i / 40; x.lineTo(-10 + p * (e2 + 10), hz - h2(p)); } x.lineTo(e2, hz + 1); x.closePath(); x.fill();
    const lp = .36, lx = -10 + lp * (e2 + 10), ly = hz - h2(lp), tw = Math.max(3, W * .005), th = Math.max(16, H * .032);
    x.fillStyle = '#EFE2D6'; x.beginPath(); x.moveTo(lx - tw, ly + 2); x.lineTo(lx - tw * .65, ly - th); x.lineTo(lx + tw * .65, ly - th); x.lineTo(lx + tw, ly + 2); x.fill();
    x.fillStyle = '#B8423A'; x.fillRect(lx - tw * .85, ly - th * .5, tw * 1.7, th * .16); x.fillRect(lx - tw * .7, ly - th * .95, tw * 1.4, th * .14);
    x.fillStyle = '#5A4048'; x.fillRect(lx - tw * .8, ly - th - tw * 1.1, tw * 1.6, tw * 1.1);
    const lg = x.createRadialGradient(lx, ly - th - tw * .5, 0, lx, ly - th - tw * .5, tw * 5);
    lg.addColorStop(0, 'rgba(255,236,170,.95)'); lg.addColorStop(1, 'rgba(255,236,170,0)');
    x.fillStyle = lg; x.beginPath(); x.arc(lx, ly - th - tw * .5, tw * 5, 0, Math.PI * 2); x.fill();
  }

  // ---------- sea base ----------
  function sea(x) {
    const g = x.createLinearGradient(0, hz, 0, shore + H * .04);
    g.addColorStop(0, '#F2BF90'); g.addColorStop(.1, '#C9A1A0'); g.addColorStop(.42, '#5E91A6'); g.addColorStop(1, '#2D7B85');
    x.fillStyle = g; x.fillRect(0, hz, W, shore - hz + H * .05);
    x.save(); x.translate(sun.x, hz); x.scale(1, 2.6);
    const pg = x.createRadialGradient(0, 0, 0, 0, 0, seaH * .55);
    pg.addColorStop(0, 'rgba(255,220,156,.6)'); pg.addColorStop(1, 'rgba(255,220,156,0)');
    x.fillStyle = pg; x.beginPath(); x.arc(0, 0, seaH * .55, 0, Math.PI * 2); x.fill(); x.restore();
    for (let i = 0; i < W * seaH / 260; i++) {
      const p = Math.pow(Math.random(), 1.2), y = hz + p * seaH;
      x.fillStyle = `rgba(30,70,90,${(.05 + p * .1).toFixed(3)})`; x.fillRect(R(0, W), y, 3 + p * 24, .8 + p);
    }
    x.fillStyle = 'rgba(255,232,190,.85)'; x.fillRect(0, hz - .5, W, 1.3);
  }

  // ---------- sand ----------
  function sand(x) {
    x.beginPath(); x.moveTo(0, H);
    for (let xx = 0; xx <= W; xx += 8) x.lineTo(xx, shore + Math.sin(xx * .004) * H * .004);

    c.lineTo(W, shore - 2); c.closePath();

    wg.addColorStop(0, 'rgba(110,184,190,.6)'); wg.addColorStop(1, 'rgba(206,232,230,.35)');
    c.fillStyle = wg; c.fill();

      const sg = c.createRadialGradient(0, 0, 0, 0, 0, H * .1); sg.addColorStop(0, 'rgba(255,224,170,.55)'); sg.addColorStop(1, 'rgba(255,224,170,0)');
      c.fillStyle = sg; c.beginPath(); c.arc(0, 0, H * .1, 0, Math.PI * 2); c.fill(); c.restore();

    return b;
  }
  const filt = (type, f, q = .7) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const gainN = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  function src(buf, list) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * buf.duration); list.push(s); return s; }
  function lfo(param, rate, depth, list) { const o = ctx.createOscillator(), g = gainN(depth); o.frequency.value = rate; o.connect(g); g.connect(param); o.start(); list.push(o); }
  function chain(...nodes) { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); return nodes[nodes.length - 1]; }

  // ----- bus for the lofi station (crossfades on change) -----
  function makeBus(lp) {
    const d = gainN(0), w = gainN(0), t = ctx.currentTime;
    if (lp) { const f = filt('lowpass', lp, .5); d.connect(f); f.connect(dry); } else d.connect(dry);
    w.connect(revSend);
    [d, w].forEach(g => g.gain.linearRampToValueAtTime(1, t + 1.5));
    return { d, w, beds: [] };
  }
  function send(node, b, wet) { node.connect(b.d); if (wet) { const g = gainN(wet); node.connect(g); g.connect(b.w); } }
  function fadeOutBus() {
    if (!bus) return;
    const b = bus, t = ctx.currentTime;
    [b.d, b.w].forEach(g => { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 1.2); });
    setTimeout(() => { b.beds.forEach(s => { try { s.stop(); } catch (e) {} }); try { b.d.disconnect(); b.w.disconnect(); } catch (e) {} }, 1600);
    bus = null;
  }

  // ----- instruments -----
  function piano(b, m, t, dur = 3.5, vel = .12, wet = .45) {
    const f = mtof(m), g = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(4000, f * 6), t); lp.frequency.exponentialRampToValueAtTime(Math.max(280, f * 1.4), t + dur);
    const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2; o2.detune.value = rnd(-4, 4);
    const g2 = gainN(.28); o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .006); g.gain.exponentialRampToValueAtTime(vel * .35, t + .45); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    send(g, b, wet); o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  function ep(b, m, t, dur = 2.4, vel = .1, wet = .35) {
    const f = mtof(m), car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
    car.frequency.value = f; mod.frequency.value = f;
    mg.gain.setValueAtTime(f * 1.1, t); mg.gain.exponentialRampToValueAtTime(f * .04, t + dur * .6);
    mod.connect(mg); mg.connect(car.frequency); car.connect(g);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .01); g.gain.exponentialRampToValueAtTime(vel * .4, t + .5); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    send(g, b, wet); car.start(t); mod.start(t); car.stop(t + dur + .05); mod.stop(t + dur + .05);
  }
  function bell(b, m, t, dur = 4.5, vel = .1, wet = .9) {
    const f = mtof(m), g = ctx.createGain();
    [[1, 1], [2.76, .25], [5.4, .08]].forEach(([r, a]) => { const o = ctx.createOscillator(), og = gainN(a); o.frequency.value = f * r; o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .05); });
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    send(g, b, wet);
  }
  function bass(b, m, t, dur = .8, vel = .2) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = filt('lowpass', 380);
    o.type = 'triangle'; o.frequency.value = mtof(m); o.connect(lp); lp.connect(g);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    send(g, b, 0); o.start(t); o.stop(t + dur + .05);
  }
  function kick(b, t, vel = .34) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(105, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(.0001, t + .42);
    o.connect(g); send(g, b, 0); o.start(t); o.stop(t + .45);
  }
  function hit(b, t, type, f, q, vel, dur, wet = 0) {
    const s = ctx.createBufferSource(); s.buffer = bufs.white;
    const fl = filt(type, f, q), g = ctx.createGain();
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(g); send(g, b, wet); s.start(t, Math.random() * 4); s.stop(t + dur + .02);
  }

  // ----- lofi stations -----
  const LOFI = [
    { name: 'Golden Hour', desc: 'Warm keys, lazy beat', bpm: 72, swing: .3, keys: 'ep', lp: 5200, crackle: .3,
      prog: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 55, 59, 64]], mel: [72, 74, 76, 79, 81],
      bassAt: [0, 10], kickAt: [0, 10], hat: 2, comp: 10, melP: .06 },
    { name: 'Beach Café', desc: 'Jazzy chords, walking bass', bpm: 84, swing: .34, keys: 'ep', lp: 6500, crackle: .18,
      prog: [[48, 51, 55, 58, 62], [41, 51, 55, 57, 60], [46, 50, 57, 60, 62], [43, 50, 53, 58]], mel: [70, 72, 74, 77, 79, 82],
      bassAt: [0, 6, 10, 14], walk: true, kickAt: [0, 8, 10], hat: 1, comp: 7, melP: .08 },
    { name: 'Sunday Piano', desc: 'Soft piano over a gentle groove', bpm: 68, swing: .25, keys: 'piano', lp: 4800, crackle: .22,
      prog: [[51, 55, 58, 62], [48, 55, 58, 63], [44, 51, 55, 60], [46, 53, 56, 60]], mel: [75, 77, 79, 82, 84],
      bassAt: [0, 10], kickAt: [0, 10], hat: 2, comp: 8, melP: .1 },
    { name: 'Late Night Tape', desc: 'Slow, dusty and a little moody', bpm: 62, swing: .3, keys: 'ep', lp: 2600, crackle: .5,
      prog: [[45, 55, 60, 64], [50, 53, 57, 60, 64], [41, 52, 57, 60], [40, 50, 56, 59]], mel: [69, 72, 74, 76, 79],
      bassAt: [0, 11], kickAt: [0, 11], hat: 4, comp: 9, melP: .05 },
    { name: 'Music off', desc: 'Only nature sounds', none: true }
  ];

  function lofiStep(st, b, t, s) {
    const bar = Math.floor(s / 16), i = s % 16, k = bar % st.prog.length, ch = st.prog[k];
    const root = ch[0] >= 45 ? ch[0] - 12 : ch[0], nextRoot = (st.prog[(k + 1) % st.prog.length][0]);
    const play = st.keys === 'piano' ? (m, tt, d, v) => piano(b, m, tt, d * 1.4, v * 1.2) : (m, tt, d, v) => ep(b, m, tt, d, v);
    if (i === 0) ch.forEach((m, j) => play(m, t + j * rnd(.008, .02), 3, .075));
    if (i === st.comp && chance(.55)) ch.slice(1).forEach((m, j) => play(m, t + j * .01, 1.6, .045));
    const bi = st.bassAt.indexOf(i);
    if (bi >= 0) {
      let n = root;
      if (st.walk) n = [root, root + 3, root + 7, (nextRoot >= 45 ? nextRoot - 12 : nextRoot) - 1][bi] || root;
      bass(b, n, t, st.walk ? .5 : .85, .19);
    }
    if (st.kickAt.includes(i) || (i === 7 && chance(.25))) kick(b, t);
    if (i === 4 || i === 12) hit(b, t, 'bandpass', 1700, .8, .12, .17, .25);
    if (i % st.hat === 0) hit(b, t, 'highpass', 7500, .7, i % 4 === 0 ? .032 : .02, .05);
    if (i !== 0 && chance(st.melP)) play(pick(st.mel), t, 2.2, .05);
  }

  function scheduler() {
    const st = LOFI[S.station];
    if (!bus || st.none) return;
    const six = 60 / st.bpm / 4, ahead = document.hidden ? 1.5 : .25;
    while (nextTime < ctx.currentTime + ahead) {
      let t = nextTime;
      if (st.swing && step % 2 === 1) t += six * st.swing;
      try { lofiStep(st, bus, t, step); } catch (e) { console.error(e); }
      nextTime += six; step++;
    }
  }
  function startStation() {
    fadeOutBus();
    const st = LOFI[S.station];
    if (st.none) return;
    bus = makeBus(st.lp);
    if (st.crackle) { const s = src(bufs.crackle, bus.beds), f = filt('bandpass', 2600, .6), g = gainN(st.crackle); chain(s, f, g); send(g, bus, 0); }
    step = 0; nextTime = ctx.currentTime + .1;
    if (!tick) tick = setInterval(scheduler, 25);
  }

  // ----- nature sounds -----
  const BUILD = {
    ocean(out, L) {
      const s = src(bufs.brown, L), lp = filt('lowpass', 650), g = gainN(.55);
      chain(s, lp, g, out); lfo(g.gain, .085, .38, L); lfo(g.gain, .031, .12, L); lfo(lp.frequency, .085, 380, L);
      const s2 = src(bufs.white, L), bp = filt('bandpass', 1600, .6), g2 = gainN(.05);
      chain(s2, bp, g2, out); lfo(g2.gain, .085, .045, L);
    },
    river(out, L) {
      [[520, .43, 160, .22], [1150, .71, 330, .17], [2400, 1.13, 650, .1]].forEach(([f, r, dp, v]) => {
        const s = src(bufs.white, L), bp = filt('bandpass', f, 1.4), g = gainN(v);
        chain(s, bp, g, out); lfo(bp.frequency, r, dp, L); lfo(g.gain, r * 1.7, v * .45, L);
      });
      const s = src(bufs.brown, L), lp = filt('lowpass', 260), g = gainN(.3); chain(s, lp, g, out);
    },
    rain(out, L) {
      const s = src(bufs.white, L), hp = filt('highpass', 450), lp = filt('lowpass', 2400), g = gainN(.12);
      chain(s, hp, lp, g, out); lfo(g.gain, .04, .03, L);
      const d = src(bufs.drips, L), bp = filt('bandpass', 3000, 1), g2 = gainN(.55); chain(d, bp, g2, out);
    },
    fire(out, L) {
      const s = src(bufs.brown, L), lp = filt('lowpass', 340), g = gainN(.38); chain(s, lp, g, out); lfo(g.gain, .27, .1, L);
      const c = src(bufs.fire, L), hp = filt('highpass', 700), pk = filt('peaking', 2600, 1), g2 = gainN(.7); pk.gain.value = 4; chain(c, hp, pk, g2, out);
    }
  };
  function natureOn(id) {
    if (!ctx || natNodes[id]) return;
    const g = gainN(0), L = []; g.connect(natOut);
    BUILD[id](g, L);
    g.gain.linearRampToValueAtTime(S.nature[id].v, ctx.currentTime + 1.2);
    natNodes[id] = { g, L };
  }
  function natureOff(id) {
    const n = natNodes[id]; if (!n) return;
    const t = ctx.currentTime; n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(n.g.gain.value, t); n.g.gain.linearRampToValueAtTime(0, t + .8);
    delete natNodes[id];
    setTimeout(() => { n.L.forEach(s => { try { s.stop(); } catch (e) {} }); try { n.g.disconnect(); } catch (e) {} }, 1000);
  }

  // ----- transport -----
  function play() {
    initAudio();
    ctx.resume();
    playing = true;
    const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(S.vol, t + .8);
    startStation();
    NATURE.forEach(n => S.nature[n.id].on && natureOn(n.id));
    render();
  }
  function pause() {
    if (!ctx) return;
    playing = false;
    const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + .5);
    setTimeout(() => { if (!playing) { fadeOutBus(); clearInterval(tick); tick = null; Object.keys(natNodes).forEach(natureOff); ctx.suspend(); } }, 650);
    render();
  }
  const toggle = () => playing ? pause() : play();
  function selectStation(i) {
    S.station = (i + LOFI.length) % LOFI.length; save();
    if (playing) startStation();
    render();
  }
  const go = d => selectStation(S.station + d);

  // ----- UI -----
  const stList = $('stations'), natList = $('nature');
  LOFI.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button class="stn" data-i="${i}" aria-pressed="false"><span><span class="n">${s.name}</span><span class="d">${s.desc}</span></span><span class="dot" aria-hidden="true"></span></button>`;
    stList.appendChild(li);
  });
  stList.addEventListener('click', e => { const b = e.target.closest('.stn'); if (!b) return; selectStation(+b.dataset.i); if (!playing) play(); });

  const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  NATURE.forEach(n => {
    const li = document.createElement('li'); li.className = 'nat';
    li.innerHTML = `<button class="tg" data-id="${n.id}" aria-pressed="false">${icon(n.d)}<span>${n.name}</span></button>
      <input type="range" min="0" max="100" data-id="${n.id}" aria-label="${n.name} volume">`;
    natList.appendChild(li);
  });
  natList.addEventListener('click', e => {
    const b = e.target.closest('.tg'); if (!b) return;
    const id = b.dataset.id, st = S.nature[id]; st.on = !st.on; save();
    if (st.on) { if (!playing) play(); else natureOn(id); } else natureOff(id);
    render();
  });
  natList.addEventListener('input', e => {
    const id = e.target.dataset.id; if (!id) return;
    S.nature[id].v = e.target.value / 100; save();
    const n = natNodes[id]; if (n) n.g.gain.setTargetAtTime(S.nature[id].v, ctx.currentTime, .08);
  });

  function render() {
    const st = LOFI[S.station], nat = NATURE.filter(n => S.nature[n.id].on).map(n => n.name.toLowerCase());
    $('np-name').textContent = st.none ? (nat.length ? 'Nature only' : 'Silence') : st.name;
    $('np-desc').textContent = !playing ? 'press play' : (st.none ? (nat.join(' + ') || 'pick a sound') : (nat.length ? 'lofi + ' + nat.join(' + ') : 'lofi'));
    $('ico-play').style.display = playing ? 'none' : ''; $('ico-pause').style.display = playing ? '' : 'none';
    $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    stList.querySelectorAll('.stn').forEach((b, i) => b.setAttribute('aria-pressed', i === S.station ? 'true' : 'false'));
    NATURE.forEach(n => {
      const on = S.nature[n.id].on;
      natList.querySelector(`.tg[data-id="${n.id}"]`).setAttribute('aria-pressed', on ? 'true' : 'false');
      const r = natList.querySelector(`input[data-id="${n.id}"]`); r.value = Math.round(S.nature[n.id].v * 100); r.disabled = !on;
    });
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: $('np-name').textContent, artist: 'Lehrein', album: 'Golden hour' }); navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch (e) {}
    }
  }
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', play); navigator.mediaSession.setActionHandler('pause', pause);
      navigator.mediaSession.setActionHandler('nexttrack', () => go(1)); navigator.mediaSession.setActionHandler('previoustrack', () => go(-1));
    } catch (e) {}
  }

  $('play').addEventListener('click', toggle);
  $('prev').addEventListener('click', () => go(-1));
  $('next').addEventListener('click', () => go(1));
  const volEl = $('vol'); volEl.value = Math.round(S.vol * 100);
  volEl.addEventListener('input', () => { S.vol = volEl.value / 100; save(); if (ctx && playing) master.gain.setTargetAtTime(S.vol, ctx.currentTime, .05); });

  // sounds panel
  const mix = $('mix'), mixbtn = $('mixbtn'), desk = window.matchMedia('(min-width: 900px)');
  function setMix(open) { mix.hidden = !open; mixbtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  setMix(desk.matches);
  mixbtn.addEventListener('click', () => setMix(mix.hidden));
  $('chip').addEventListener('click', () => setMix(true));

  // keyboard
  document.addEventListener('keydown', e => {
    wake();
    if (e.target.closest('input')) return;
    if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Escape' && !desk.matches) setMix(false);
  });

  // hide the interface after a quiet spell so the scene can breathe
  let idleT;
  function wake() {
    document.body.classList.remove('idle'); clearTimeout(idleT);
    idleT = setTimeout(() => { const a = document.activeElement; if (playing && (!a || a === document.body || !a.matches(':focus-visible'))) document.body.classList.add('idle'); }, 7000);
  }
  ['pointermove', 'pointerdown', 'touchstart', 'wheel'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));
  wake();

  // tiny pixel equaliser
  const eq = $('eq'), ec = eq.getContext('2d');
  (function drawEq() {
    requestAnimationFrame(drawEq);
    ec.clearRect(0, 0, 68, 44);
    for (let i = 0; i < 5; i++) {
      let v = .15;
      if (playing && analyser) { analyser.getByteFrequencyData(fdata); v = fdata[2 + i * 5] / 255; }
      const h = Math.max(8, v * 44);
      ec.fillStyle = '#FFC56E'; ec.beginPath(); ec.roundRect ? ec.roundRect(i * 14, 44 - h, 8, h, 4) : ec.rect(i * 14, 44 - h, 8, h); ec.fill();
    }
  })();

  // ----- focus timer -----
  let total = 25 * 60, left = total, running = false, tInt = null, endAt = 0;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  function tRender() {
    $('time').textContent = fmt(left);
    $('tstart').textContent = running ? 'Pause' : (left < total ? 'Resume' : 'Start session');
    const chip = $('chip'); chip.hidden = !running; chip.textContent = fmt(left);
    document.title = running ? `${fmt(left)} · lehrein` : 'Lehrein — lofi and nature sounds for deep study';
  }
  function chime() {
    initAudio(); ctx.resume();
    const b = { d: master, w: revSend }, t = ctx.currentTime + .05;
    if (!playing) { master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(S.vol, t); master.gain.setValueAtTime(0, t + 5.5); setTimeout(() => { if (!playing) ctx.suspend(); }, 6000); }
    [81, 85, 88].forEach((m, i) => bell(b, m, t + i * .4, 4.5, .14));
  }
  function tTick() {
    left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (left === 0) { clearInterval(tInt); running = false; chime(); $('tnote').textContent = 'Session done. Stretch, sip water, look at the waves.'; left = total; }
    tRender();
  }
  $('tstart').addEventListener('click', () => {
    if (running) { clearInterval(tInt); running = false; tRender(); return; }
    running = true; endAt = Date.now() + left * 1000; $('tnote').textContent = 'One task. Phone face down.';
    tInt = setInterval(tTick, 250); if (!playing) play(); tRender();
  });
  $('treset').addEventListener('click', () => { clearInterval(tInt); running = false; left = total; $('tnote').textContent = ''; tRender(); });
  const customRow = $('customRow'), customMin = $('customMin');
  const customMinutes = () => Math.min(240, Math.max(1, Math.round(+customMin.value || 1)));
  try { const cm = +localStorage.getItem('lehrein-custom-min'); if (cm) customMin.value = cm; } catch (e) {}
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    const isCustom = !!b.dataset.custom;
    customRow.hidden = !isCustom;
    clearInterval(tInt); running = false;
    total = (isCustom ? customMinutes() : +b.dataset.min) * 60; left = total; $('tnote').textContent = ''; tRender();
    if (isCustom) customMin.focus();
  }));
  customMin.addEventListener('input', () => {
    if (running || customRow.hidden) return;
    total = customMinutes() * 60; left = total; tRender();
    try { localStorage.setItem('lehrein-custom-min', customMinutes()); } catch (e) {}
  });
  customMin.addEventListener('change', () => { customMin.value = customMinutes(); });

  render(); tRender();
})();
</script>
</body>
</html>
